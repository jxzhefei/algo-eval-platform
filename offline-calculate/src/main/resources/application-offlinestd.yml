spring:
  application:
    name: offline-calculate
  datasource:
    url: ${DB_URL:jdbc:h2:mem:offlinedemo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

algo:
  offline:
    heartbeat-interval-ms: 5000
    heartbeat-timeout-ms: 30000
    reap-interval-ms: 10000
    max-retry: 3
